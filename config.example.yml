# Example configuration for the X wire service.
# Copy to config.yml (git-ignored) and edit it: cp config.example.yml config.yml
# Replace x_bearer_token before use. A non-empty X_BEARER_TOKEN overrides it.
# The process never logs the token.

# App-only bearer token from the X developer portal (placeholder below).
x_bearer_token: "your-bearer-token-here"

# Bind address. Use 0.0.0.0 so a container or reverse proxy can reach it.
listen: "0.0.0.0:8181"

# Public URL prefix. "/" (or empty) serves the site at the domain root,
# e.g. https://x.0x6.ai/. Use a prefix such as "/x" to mount it under a path.
base_path: "/"

# Browser cache lifetime. 0 sends `private, no-cache` so a new daily
# slot is noticed. Responses still include an ETag.
cache_max_age_secs: 0

# Newest posts shown on a tab after merging that tab's accounts (1–100).
posts_per_tab: 20

# Posts kept in each account's JSONL file (1–5000, at least posts_per_tab).
max_stored_posts: 400

# Largest image saved locally. 0 keeps the remote URL and skips downloads.
max_image_bytes: 8000000

# Original posts only. Set either to false to show replies or reposts.
exclude_replies: true
exclude_retweets: true

# App-only X API v2 origin. Override with http://127.0.0.1:PORT for tests.
api_base: "https://api.x.com"

# One JSONL file and one state file per account live here.
data_dir: "data"

# Slot boundaries use this IANA time zone.
# By default each local day (00:00–24:00) is one slot. A tab may set
# refresh_hours (1, 2, 3, 4, 6, 8, 12 or 24) for shorter slots; 6 gives
# 00–06, 06–12, 12–18 and 18–24. Each account is fetched at most once per
# slot of the tab being opened, and only when that tab is opened.
timezone: "Asia/Taipei"

# Text shown after displayed times, e.g. "2026-10-09 10:46 Taiwan".
# Leave unset to show the UTC offset ("UTC+08:00") instead.
timezone_label: "Taiwan"

tabs:
  - label: News
    refresh_hours: 6   # optional; default 24
    accounts:
      - BBCWorld
      - Reuters
  - label: Tech
    accounts:
      - github
      - rustlang
  - label: Space
    accounts:
      - NASA
      - SpaceX

# Optional credits in the page footer. url must be http(s); links may be http(s) or mailto:.
# Remove the block to show no credits.
footer:
  text: "Copyright © 0x6.ai"   # plain text; set url to make it a link
  links:
    - { label: "About", url: "https://0x6.ai/about.html" }
    - { label: "Terms", url: "https://0x6.ai/terms.html" }
    - { label: "Privacy", url: "https://0x6.ai/privacy.html" }
    - { label: "0x6@mail.grokbot.com", url: "mailto:0x6@mail.grokbot.com" }
    - { label: "☕ Buy me a coffee", url: "https://0x6.ai/donate/" }
  note: "Rights in posts, images, and account names belong to their authors and X, and do not reflect the views of 0x6.ai. Content is updated with a delay, so rely on the original post on X."
