[package]
name = "xfeed"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Fast multi-tab site of recent posts from X"
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
bytes = "1"
brotli = "6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
